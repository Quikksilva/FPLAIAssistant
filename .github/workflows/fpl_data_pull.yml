name: FPL Data Pull

# Runs on GitHub's own infrastructure - no dependency on any local machine
# being on. Fetches fresh data straight from the official FPL API and
# commits it back to the repo, so the Claude cloud routine (which runs
# later each day and has no direct network access to fantasy.premierleague.com)
# always has up-to-date data to work from.

on:
  schedule:
    - cron: "0 8 * * *"   # daily, 08:00 UTC - well before the 10:00 UTC review check
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run FPL data pull
        run: python fpl_data_pull.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "FPL Data Bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add fpl_data/
          if git diff --cached --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "Automated daily FPL data refresh"
            git push
          fi
